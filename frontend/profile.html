<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的画像 — AI 旅游规划助手</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    .profile-page { max-width: 720px; margin: 0 auto; padding: 32px 20px 60px; }
    .profile-page h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 6px; color: var(--ink); }
    .profile-page .subtitle { font-size: .9rem; color: #6b7280; margin-bottom: 28px; }
    .profile-field { margin-bottom: 22px; }
    .profile-field .field-label {
      font-size: .8rem; font-weight: 700; color: var(--teal-700);
      letter-spacing: .03em; margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
    }
    .tag-editor {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      background: #fff; border: 1.5px solid var(--line); border-radius: var(--r-md);
      padding: 10px 12px; min-height: 48px; transition: border-color .15s;
    }
    .tag-editor:focus-within { border-color: var(--teal-500); }
    .tag {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--teal-100); color: var(--teal-700);
      border-radius: 99px; padding: 4px 10px; font-size: .85rem; font-weight: 600;
    }
    .tag .tag-remove {
      cursor: pointer; border: none; background: none; color: var(--teal-700);
      font-size: .9rem; line-height: 1; padding: 0; opacity: .6;
    }
    .tag .tag-remove:hover { opacity: 1; }
    .tag-input {
      flex: 1; min-width: 120px; border: none; outline: none;
      font: inherit; font-size: .9rem; color: var(--ink); background: transparent;
    }
    .tag-input::placeholder { color: var(--ink-4); }
    .profile-actions { display: flex; align-items: center; gap: 14px; margin-top: 28px; }
    .save-btn {
      padding: 11px 28px; border-radius: 10px; border: none;
      background: var(--teal-500); color: #fff; font-size: .95rem; font-weight: 700;
      cursor: pointer; transition: background .15s;
    }
    .save-btn:hover { background: var(--teal-700); }
    .save-btn:disabled { opacity: .6; cursor: not-allowed; }
    .save-hint { font-size: .85rem; color: var(--teal-700); opacity: 0; transition: opacity .2s; }
    .save-hint.show { opacity: 1; }
    .loading-hint { text-align: center; padding: 60px; color: #9ca3af; }
  </style>
</head>
<body>
  <div id="nav-placeholder"></div>

  <main class="profile-page">
    <h1>我的旅行画像</h1>
    <p class="subtitle">这些偏好会在每次规划时自动作为默认参考。输入后按回车或逗号添加，点 ✕ 删除。</p>
    <div id="profile-body">
      <div class="loading-hint">加载中…</div>
    </div>
  </main>

  <script src="/profile.js"></script>
</body>
</html>
